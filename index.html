<script>
const initialBoards=["잡담","임무","뒷 정보","아카데미","괴이"];
const examples=[
["잡담","[잡담] 좋아하는 컵라면은?","야식 먹을 때 다들 무슨 컵라면 먹어? 요즘 편의점 신상이 궁금함.",1,["김치사발면은 배신하지 않는다.","매운 거 먹으면 다음 날 후회하면서 또 먹음ㅋㅋ","나는 작은 컵보다 큰 컵.","이 시간에 이런 글 올리지 마 배고프잖아."]],
["잡담","오늘따라 복도가 조용하지 않냐","수업 끝났는데 평소보다 사람이 없는 느낌. 다들 어디 간 거지?",6,["임무 나갔다고 들었는데.","그 얘기 여기서 해도 됨?","복도 끝에서 소리 들리던데."]],
["잡담","잠 안 오는 사람","새벽에 깨어 있는 사람 있냐. 아무 말이나 하고 가.",12,["내일 일정 있는데 망했다.","창밖에 뭐 지나간 것 같은데 착각인가.","그런 말 하지 마."]],
["잡담","요즘 자주 듣는 노래 추천 좀","장르 안 가림. 반복해서 들어도 안 질리는 걸로.",4,["오래된 애니 OST.","가사 없는 곡도 좋아.","추천해 주면 들어볼게."]],
["잡담","익명인데도 눈치 보이는 건 왜일까","누가 썼는지도 모르는데 글 올릴 때 괜히 망설이게 됨.",9,["여기 은근히 보는 사람 많잖아.","익명이라고 완전히 안전한 건 아니니까."]],
["임무","고 랭크 임무에 저급 아티팩트 들고 오는 놈은 대체 뭔데?","장비 확인도 임무 준비에 포함되는 거 아님? 현장에서 빌려 달라고 하지 좀 마.",8,["아티팩트 등급보다 사용자가 문제일 때도 있음.","이번 주에 비슷한 일 있었음.","누군지 다 아는데 여기서 말하지 말자."]],
["임무","[속보] 임무 구역에서 정체불명의 흔적 발견","현장 사진은 아직 공개 금지라 함. 복귀한 사람들 말이 다 달라서 더 찜찜함.",13,["발자국 방향이 이상했다는 얘기 들음.","사진 올라오기 전까지는 기다리자.","관리부에서 함구하라고 했대."]],
["임무","팀 편성 공지 확인했냐","명단이 새벽에 바뀌었다는데 내 이름이 두 군데에 들어가 있음. 오류겠지?",2,["담당자한테 바로 문의해.","가끔 시스템 갱신 늦음.","두 팀 다 나가라는 뜻이면 무섭네."]],
["임무","임무 복귀 후 기억이 끊긴 사람 있음?","보고서 쓰다가 시간대가 안 맞는 부분을 발견함. 나만 그런 건지 모르겠다.",19,["이런 건 담당자에게 먼저 말해.","기록이랑 실제 시간이 다르다는 사람 있었음.","어떤 구역이었는지 말하지 마."]],
["임무","현장 지급품 목록이 바뀐 듯","평소 지급되던 봉인 테이프가 목록에서 빠져 있음. 대체품 안내도 없고.",5,["보급부 공지 봤어?","이번 달부터 지급 기준 바뀐다고 함."]],
["뒷 정보","질문 : 미래를 아는 남자에 대하여","그 사람 관련해서 확인된 정보가 있나? 소문이 너무 제각각이라 정리하고 싶음.",3,["미래를 본다는 게 정확히 무슨 뜻인데?","맞았다는 예언도 있고 틀렸다는 얘기도 있음.","그 사람 이야기만 나오면 글이 사라지던데."]],
["뒷 정보","[나쁜 소식?] 곧 혁명이 일어난다!! [좋은 소식?]","누가 이런 제목으로 글을 올렸는데 출처가 없음. 장난인지 진짜인지 모르겠음.",2,["자극적인 제목일수록 출처부터 확인해.","어제도 비슷한 문구가 돌았어."]],
["뒷 정보","요즘 이름이 자주 지워지는 기록","열람 기록에 빈칸이 생기는 경우가 있다는데, 시스템 오류라는 설명뿐임.",11,["기록 보존 기간이 끝난 거 아닐까.","그런데 같은 날짜만 비어 있음."]],
["뒷 정보","누가 오래된 명단을 봤다는 말이 있음","몇 년 전 명단에 현재 소속 인원이 적혀 있었다는 이야기. 진짜면 이상한데.",7,["동명이인일 가능성은?","사진까지 같았다는 댓글은 봤음."]],
["뒷 정보","게시글이 사라지는 기준 아는 사람?","삭제된 건지 숨김 처리된 건지 모르겠음. 링크는 남아 있는데 내용만 안 보여.",15,["운영 쪽에서 내린 거겠지.","아니면 작성자가 지웠거나."]],
["아카데미","아카데미 식당 오늘 메뉴","메뉴판에는 스튜라고 적혀 있는데 정체를 알 수 없는 고기가 들어 있었다는 제보.",6,["그냥 대체육이겠지.","조리실에 물어본 사람 있음?","맛은 괜찮았음. 정체는 묻지 마."]],
["아카데미","신입생들 사이에 도는 시험 괴담","시험지를 받으면 맨 마지막 문제를 읽지 말라는 말이 있음. 누가 시작한 거냐.",21,["우리 때도 있었음.","읽으면 어떻게 되는데?","아무 일도 없었다는 사람도 있더라."]],
["아카데미","도서관 3층 출입 제한 이유 아는 사람","공사 중이라는 안내는 없는데 문이 잠겨 있음. 담당자도 대답을 피하더라.",8,["자료 정리 중이라고 들었어.","지난주에는 안에서 불빛이 보였음."]],
["아카데미","실습 파트너 변경 신청 어디서 함?","공지 링크가 열리지 않음. 혹시 다른 경로 아는 사람?",1,["학사 페이지에서 신청 메뉴 찾아봐.","오늘 마감이라는 말 있던데."]],
["아카데미","기숙사 복도에 새 규칙 붙은 거 봤어?","밤 12시 이후에는 창문에 비친 사람에게 말을 걸지 말 것. 장난 공지겠지?",17,["그런 규칙이 왜 있어ㅋㅋ","지난 학기에도 비슷한 종이가 있었어.","누가 붙였는지 확인하지 마."]],
["괴이","너희들 사이에 『악마』가 숨어있어.","누군가 이런 말을 남기고 계정을 지웠다는 이야기를 들었음. 원문을 본 사람?",7,["어디 게시판에 올라왔는데?","캡처가 돌다가 전부 삭제됐어.","그렇게 단정할 근거도 없지."]],
["괴이","너희들이 모를 것 같은 괴이","사람이 없는 방에서 의자가 매일 조금씩 돌아간다는 이야기. 확인한 사람은 없음.",20,["바닥이 기울어진 거 아닐까.","그 방이 어디인지 알려줘.","위치 공개하면 사람 몰릴 테니 그만."]],
["괴이","최강의 괴이를 떠올린 사람이 우승","이름을 말하는 순간 그 괴이가 나타난다는 규칙. 댓글로 이름을 적어도 되는 건가?",27,["그럼 우승자가 제일 위험한 거 아냐?","이미 댓글에 적힌 이름이 있던데.","이런 건 장난으로도 하지 말자."]],
["괴이","거울 속 내가 한 박자 늦게 움직임","피곤해서 그런 거겠지. 다른 사람도 겪어 봤는지 궁금해서 올림.",14,["조명 깜빡임 때문에 그렇게 보일 수도.","나도 어릴 때 비슷한 경험 있었음."]],
["괴이","복도 끝에서 들리는 출석 부르는 소리","빈 건물인데 누군가 이름을 부르는 소리가 들렸다는 제보. 녹음 파일은 없음.",9,["환풍기 소리가 그렇게 들렸을 수도.","근데 이름을 정확히 불렀다고 하던데."]]
];
let S={boards:initialBoards,posts:[],active:"전체",sort:"random",hidden:[],reports:[],admin:false,edit:null,detail:null};
const $=x=>document.getElementById(x),uid=()=>Math.random().toString(36).slice(2)+Date.now().toString(36);
function seedData(){S.posts=examples.map((x,i)=>({id:"seed"+i,board:x[0],title:x[1],body:x[2],score:x[3],created:Date.now()-i*3600000,comments:x[4].map((t,j)=>({id:"c"+i+"-"+j,body:t,name:"No Name",time:Date.now()-(j+1)*3600000,score:0,replies:[]})),pinned:false,notice:false,hidden:false,reported:0,own:false}));}
function save(){localStorage.setItem("dchannel-v1",JSON.stringify({...S,admin:false,edit:null,detail:null}))}
function load(){try{let d=JSON.parse(localStorage.getItem("dchannel-v1"));if(d&&Array.isArray(d.posts)){S={...S,...d,admin:false,edit:null,detail:null};return}}catch(e){}seedData();save()}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function ago(t){let m=Math.max(0,Math.floor((Date.now()-t)/60000));return m<1?"방금 전":m<60?m+"분 전":m<1440?Math.floor(m/60)+"시간 전":Math.floor(m/1440)+"일 전"}
function toast(t){$("toast").textContent=t;$("toast").style.display="block";setTimeout(()=>$("toast").style.display="none",2000)}
function avatar(b){return b==="임무"?"blue":b==="뒷 정보"?"pink":b==="괴이"?"purple":""}
function tabs(){let arr=["전체",...S.boards];$("tabs").innerHTML=arr.map(b=>`<button class="tab ${b===S.active?"on":""}" data-board="${esc(b)}">${esc(b)}</button>`).join("");$("postBoard").innerHTML=S.boards.map(b=>`<option>${esc(b)}</option>`).join("")}

function list(){
  let q=$("search").value.toLowerCase().trim();

  let arr=S.posts.filter(p=>
    !p.hidden &&
    !S.hidden.includes(p.id) &&
    (S.active==="전체" || p.board===S.active) &&
    (!q || (p.title+" "+p.body+" "+p.board).toLowerCase().includes(q))
  );

  if(S.sort==="random"){
    arr.sort((a,b)=>
      (a.pinned!==b.pinned ? (a.pinned?-1:1) :
      a.notice!==b.notice ? (a.notice?-1:1) :
      Math.random()-0.5)
    );
  }else{
    arr.sort((a,b)=>
      a.pinned!==b.pinned ? (a.pinned?-1:1) :
      a.notice!==b.notice ? (a.notice?-1:1) :
      S.sort==="comments" ? b.comments.length-a.comments.length :
      S.sort==="votes" ? b.score-a.score :
      b.created-a.created
    );
  }

  return arr;
}

function render(){tabs();$("detail").classList.remove("open");$("detail").style.display="none";$("feed").style.display="block";$("composebar").style.display="flex";let a=list();$("feed").innerHTML=a.length?a.map(p=>`<article class="post">${p.pinned||p.notice?`<div class="pin">${p.pinned?"📌 상단 고정 ":""}${p.notice?"공지":""}</div>`:""}<div class="meta"><span class="avatar ${avatar(p.board)}">♟</span><span class="board">${esc(p.board)}</span> · <span>${esc(p.name||"No Name")}의 투고</span><button class="more" data-a="menu" data-id="${p.id}">···</button></div><h2 class="title" data-a="open" data-id="${p.id}">${esc(p.title)}</h2><div class="actions"><span><button data-a="up" data-id="${p.id}">▲</button> <span class="score">${p.score}</span> <button data-a="down" data-id="${p.id}">▼</button></span><button class="plain" data-a="open" data-id="${p.id}">● ${p.comments.length}건의 코멘트</button></div></article>`).join(""):`<div style="padding:60px 20px;text-align:center;color:#aaa">게시글이 없어. 첫 글을 남겨 봐!</div>`}
function showDetail(id){let p=S.posts.find(x=>x.id===id);if(!p)return;S.detail=id;$("feed").style.display="none";$("detail").style.display="block";$("detail").classList.add("open");$("composebar").style.display="none";$("detail").innerHTML=`<div class="meta"><button class="plain" id="detailBack" style="font-size:26px">‹</button><span class="avatar ${avatar(p.board)}">♟</span><span class="board">${esc(p.board)}</span> · ${ago(p.created)}<button class="more" data-a="menu" data-id="${p.id}">···</button></div>${p.pinned||p.notice?`<div class="pin">${p.pinned?"📌 상단 고정 ":""}${p.notice?"공지":""}</div>`:""}<h2 class="title">${esc(p.title)}</h2><p class="body">${esc(p.body)}</p><div class="actions"><button data-a="up" data-id="${p.id}">▲ <span class="score">${p.score}</span></button><button data-a="down" data-id="${p.id}">▼</button><span>● ${p.comments.length}건의 코멘트</span></div><h3 style="margin-top:24px">코멘트 ${p.comments.length}</h3><div>${p.comments.map(c=>commentHTML(c,p.id)).join("")}</div><textarea id="commentInput" placeholder="익명으로 코멘트 남기기"></textarea><button class="btn primary" id="sendComment">코멘트 등록</button>`;$("detailBack").onclick=render;$("sendComment").onclick=()=>{let t=$("commentInput").value.trim();if(!t)return toast("내용을 입력해 줘.");p.comments.push({id:uid(),name:"No Name",body:t,time:Date.now(),score:0,replies:[]});save();showDetail(id);toast("코멘트를 등록했어.")}}
function commentHTML(c,pid){return `<div class="comment"><div class="commentmeta"><span class="avatar">♟</span><span class="commentname">No Name</span><span>${ago(c.time)}</span><button class="more" data-a="cmenu" data-id="${pid}" data-cid="${c.id}">···</button></div><div class="commentbody">${esc(c.body)}</div><div class="commenttools"><button data-a="reply" data-id="${pid}" data-cid="${c.id}">● 회신</button>　<button data-a="cup" data-id="${pid}" data-cid="${c.id}">▲ ${c.score||0}</button></div><div class="reply" id="r-${c.id}"><textarea placeholder="답글 작성"></textarea><div class="row"><button class="btn" data-a="cancelreply" data-cid="${c.id}">취소</button><button class="btn primary" data-a="sendreply" data-id="${pid}" data-cid="${c.id}">답글 등록</button></div></div>${(c.replies||[]).map(r=>`<div class="comment" style="margin-left:20px;background:#fafafa;padding:10px"><div class="commentmeta"><span class="avatar">♟</span><b class="commentname">No Name</b> · ${ago(r.time)}<button class="more" data-a="rmenu" data-id="${pid}" data-cid="${c.id}" data-rid="${r.id}">···</button></div><div class="commentbody">${esc(r.body)}</div></div>`).join("")}</div>`}
function modal(title,items){$("modalTitle").textContent=title;$("modalOptions").innerHTML=items.map(x=>`<button class="option" data-m="${x.a}" data-id="${x.id||""}" data-cid="${x.cid||""}" data-rid="${x.rid||""}">${x.label}</button>`).join("");$("modalback").classList.add("open")}
function postMenu(id){let p=S.posts.find(x=>x.id===id);let a=[{label:"게시글 보기",a:"open",id},{label:"신고하기",a:"report",id},{label:"숨기기",a:"hide",id}];if(S.admin||p.own)a.push({label:"게시글 수정",a:"edit",id},{label:"게시글 삭제",a:"delete",id});if(S.admin)a.push({label:p.pinned?"상단 고정 해제":"상단 고정",a:"pin",id},{label:p.notice?"공지 해제":"공지 지정",a:"notice",id});modal("게시글 메뉴",a)}
function action(a,id,cid,rid){$("modalback").classList.remove("open");let p=S.posts.find(x=>x.id===id),c=p?.comments.find(x=>x.id===cid);if(a==="open")return showDetail(id);if(a==="report"){if(p){p.reported=(p.reported||0)+1;S.reports.push(id);save();toast("신고가 접수됐어.")}return}if(a==="hide"){S.hidden.push(id);save();render();toast("게시글을 숨겼어.");return}if(a==="edit"){if(!S.admin&&!p.own)return toast("자신이 작성한 글만 수정할 수 있어.");S.edit=id;$("formTitle").textContent="게시글 수정";$("postBoard").value=p.board;$("postTitle").value=p.title;$("postBody").value=p.body;$("composer").classList.add("open");return}if(a==="delete"){if(!S.admin&&!p.own)return toast("자신이 작성한 글만 삭제할 수 있어.");if(confirm("게시글을 삭제할까?")){S.posts=S.posts.filter(x=>x.id!==id);save();render()}return}if(a==="pin"||a==="notice"){p[a==="pin"?"pinned":"notice"]=!p[a==="pin"?"pinned":"notice"];save();render();return}if(a==="cmenu"||a==="rmenu"){let items=[{label:"신고하기",a:"creport",id,cid}];if(S.admin||p.own)items.push({label:"댓글 삭제",a:"cdelete",id,cid});if(rid&&S.admin)items.push({label:"답글 삭제",a:"rdelete",id,cid,rid});return modal("코멘트 메뉴",items)}if(a==="creport"){S.reports.push(id+":"+cid);save();toast("코멘트를 신고했어.");return}if(a==="cdelete"){if(!S.admin&&!p.own)return toast("관리 권한이 필요해.");p.comments=p.comments.filter(x=>x.id!==cid);save();showDetail(id);return}if(a==="rdelete"){c.replies=c.replies.filter(x=>x.id!==rid);save();showDetail(id)}}
$("tabs").onclick=e=>{let b=e.target.closest("[data-board]");if(b){S.active=b.dataset.board;render()}}
$("feed").onclick=e=>{let b=e.target.closest("[data-a]");if(!b)return;let p=S.posts.find(x=>x.id===b.dataset.id);if(b.dataset.a==="open")showDetail(p.id);if(b.dataset.a==="menu")postMenu(p.id);if(b.dataset.a==="up"){p.score++;save();render()}if(b.dataset.a==="down"){p.score--;save();render()}}
$("detail").onclick=e=>{let b=e.target.closest("[data-a]");if(!b)return;let {id,cid,rid}=b.dataset,a=b.dataset.a,p=S.posts.find(x=>x.id===id),c=p?.comments.find(x=>x.id===cid);if(a==="menu")postMenu(id);if(a==="cmenu"||a==="rmenu")action(a,id,cid,rid);if(a==="up"){p.score++;save();showDetail(id)}if(a==="down"){p.score--;save();showDetail(id)}if(a==="cup"){c.score=(c.score||0)+1;save();showDetail(id)}if(a==="reply")$("r-"+cid).classList.toggle("open");if(a==="cancelreply")$("r-"+cid).classList.remove("open");if(a==="sendreply"){let t=$("r-"+cid).querySelector("textarea").value.trim();if(!t)return toast("답글을 입력해 줘.");c.replies=c.replies||[];c.replies.push({id:uid(),body:t,time:Date.now()});save();showDetail(id)}}
$("modalOptions").onclick=e=>{let b=e.target.closest("[data-m]");if(!b)return;let a=b.dataset.m,id=b.dataset.id;if(a==="sort-random"||a==="sort-comments"||a==="sort-votes"){S.sort=a.slice(5);$("modalback").classList.remove("open");render();return}if(a==="all"){S.active="전체";$("modalback").classList.remove("open");render();return}if(a==="unhide"){S.hidden=[];save();$("modalback").classList.remove("open");render();return}if(a==="admin"){$("modalback").classList.remove("open");$("admin").classList.toggle("open");return}action(a,id,b.dataset.cid,b.dataset.rid)}
$("closeModal").onclick=()=>$("modalback").classList.remove("open");$("modalback").onclick=e=>{if(e.target===$("modalback"))$("modalback").classList.remove("open")}
$("newPost").onclick=()=>{S.edit=null;$("formTitle").textContent="새 게시글";$("postTitle").value="";$("postBody").value="";$("postBoard").value=S.active==="전체"?S.boards[0]:S.active;$("composer").classList.add("open");$("composer").scrollIntoView({behavior:"smooth",block:"start"})}
$("cancel").onclick=()=>$("composer").classList.remove("open")
$("savePost").onclick=()=>{let title=$("postTitle").value.trim(),body=$("postBody").value.trim(),board=$("postBoard").value;if(!title||!body)return toast("제목과 내용을 입력해 줘.");if(S.edit){let p=S.posts.find(x=>x.id===S.edit);if(p){p.title=title;p.body=body;p.board=board}S.edit=null}else S.posts.unshift({id:uid(),board,title,body,score:0,created:Date.now(),comments:[],pinned:false,notice:false,own:true});save();$("composer").classList.remove("open");render();toast("게시글을 저장했어.")}
$("search").oninput=render;$("focusSearch").onclick=()=>$("search").focus()
$("sortBtn").onclick=()=>modal("글 정렬",[{label:"무작위 순",a:"sort-random"},{label:"최신순",a:"sort-latest"},{label:"댓글 많은 순",a:"sort-comments"},{label:"추천 많은 순",a:"sort-votes"}])
$("menuBtn").onclick=()=>modal("메뉴",[{label:"전체 게시글",a:"all"},{label:"숨긴 글 다시 보기",a:"unhide"},{label:"신고 내역 보기",a:"reports"},{label:"제작자 설정 열기",a:"admin"}])
$("profile").onclick=$("adminBtn").onclick=()=>$("admin").classList.toggle("open")
$("adminToggle").onclick=()=>{S.admin=!S.admin;$("adminToggle").textContent=S.admin?"관리 모드 끄기":"관리 모드 켜기";$("adminStatus").textContent=S.admin?"관리 모드가 켜져 있어.":"관리 모드가 꺼져 있어.";toast(S.admin?"관리 모드 켜짐":"관리 모드 꺼짐");render()}
$("addBoard").onclick=()=>{let n=$("boardName").value.trim();if(!n)return toast("게시판 이름을 입력해 줘.");if(S.boards.includes(n))return toast("이미 있는 게시판이야.");S.boards.push(n);$("boardName").value="";save();render();toast("게시판을 추가했어.")}
$("export").onclick=()=>{let a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify({...S,admin:false},null,2)],{type:"application/json"}));a.download="dchannel-backup.json";a.click();URL.revokeObjectURL(a.href)}
$("importBtn").onclick=()=>$("importFile").click()
$("importFile").onchange=async e=>{try{let d=JSON.parse(await e.target.files[0].text());if(!Array.isArray(d.posts)||!Array.isArray(d.boards))throw Error();S={...S,...d,admin:false};save();render();toast("백업을 불러왔어.")}catch(x){toast("백업 파일을 읽지 못했어.")}}
$("back").onclick=()=>{if(S.detail)render();else{S.active="전체";$("search").value="";render()}}
load();render();
</script></body></html>
